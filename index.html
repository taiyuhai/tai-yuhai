<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산기 / 计算器</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.15);
      
      --display-bg: rgba(15, 23, 42, 0.75);
      --display-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --btn-num-bg: rgba(51, 65, 85, 0.65);
      --btn-num-hover: rgba(71, 85, 105, 0.85);
      --btn-num-text: #f8fafc;

      --btn-op-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --btn-op-hover: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      --btn-op-text: #ffffff;
      --btn-op-active-glow: rgba(59, 130, 246, 0.5);

      --btn-eq-bg: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-eq-hover: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      --btn-eq-text: #ffffff;
      --btn-eq-glow: rgba(16, 185, 129, 0.5);

      --btn-func-bg: rgba(71, 85, 105, 0.5);
      --btn-func-hover: rgba(100, 116, 139, 0.7);
      --btn-func-text: #cbd5e1;

      --btn-danger-bg: rgba(239, 68, 68, 0.15);
      --btn-danger-hover: rgba(239, 68, 68, 0.28);
      --btn-danger-border: rgba(239, 68, 68, 0.35);
      --btn-danger-text: #fca5a5;

      --badge-bg: rgba(99, 102, 241, 0.15);
      --badge-border: rgba(99, 102, 241, 0.3);
      --badge-text: #a5b4fc;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(255, 255, 255, 0.7);
      --card-shadow: 0 20px 40px -10px rgba(100, 116, 139, 0.3), 0 0 25px rgba(99, 102, 241, 0.12);

      --display-bg: rgba(248, 250, 252, 0.95);
      --display-border: rgba(203, 213, 225, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;

      --btn-num-bg: rgba(255, 255, 255, 0.9);
      --btn-num-hover: #f1f5f9;
      --btn-num-text: #1e293b;

      --btn-op-bg: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --btn-op-hover: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
      --btn-op-text: #ffffff;
      --btn-op-active-glow: rgba(59, 130, 246, 0.35);

      --btn-eq-bg: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --btn-eq-hover: linear-gradient(135deg, #34d399 0%, #059669 100%);
      --btn-eq-text: #ffffff;
      --btn-eq-glow: rgba(16, 185, 129, 0.35);

      --btn-func-bg: rgba(241, 245, 249, 0.9);
      --btn-func-hover: rgba(226, 232, 240, 0.95);
      --btn-func-text: #334155;

      --btn-danger-bg: rgba(254, 226, 226, 0.8);
      --btn-danger-hover: rgba(254, 202, 202, 0.95);
      --btn-danger-border: rgba(239, 68, 68, 0.3);
      --btn-danger-text: #b91c1c;

      --badge-bg: rgba(99, 102, 241, 0.1);
      --badge-border: rgba(99, 102, 241, 0.25);
      --badge-text: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", "Noto Sans KR", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      padding: 20px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Container */
    .calculator-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s ease;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-main {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-main .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 8px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      font-weight: 600;
    }

    .title-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--btn-func-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 10px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.2s ease;
      font-size: 0.72rem;
    }

    .icon-btn:hover {
      background: var(--btn-num-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .icon-btn .icon {
      font-size: 0.95rem;
    }

    /* Display Area */
    .display-container {
      background: var(--display-bg);
      border: 1px solid var(--display-border);
      border-radius: 20px;
      padding: 16px 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .display-container:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .display-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      min-height: 16px;
    }

    .copy-hint {
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 0.68rem;
      color: var(--badge-text);
    }

    .display-container:hover .copy-hint {
      opacity: 1;
    }

    .expression-line {
      min-height: 22px;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: right;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      font-family: "SF Mono", "Consolas", monospace;
    }

    .expression-line::-webkit-scrollbar {
      display: none;
    }

    .main-line {
      font-size: 2.3rem;
      font-weight: 700;
      text-align: right;
      color: var(--text-main);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      line-height: 1.15;
      font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .main-line::-webkit-scrollbar {
      display: none;
    }

    .main-line.is-error {
      color: #ef4444;
      font-size: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .error-tag {
      font-size: 0.75rem;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 6px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      outline: none;
      position: relative;
      transition: transform 0.12s ease, filter 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn .primary-label {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .btn .sub-label {
      font-size: 0.68rem;
      line-height: 1;
      font-weight: 500;
      opacity: 0.82;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Number Keys */
    .btn-num {
      background: var(--btn-num-bg);
      color: var(--btn-num-text);
    }

    .btn-num:hover {
      background: var(--btn-num-hover);
    }

    .btn-num .sub-label {
      color: var(--text-muted);
    }

    /* Operator Keys */
    .btn-op {
      background: var(--btn-op-bg);
      color: var(--btn-op-text);
      box-shadow: 0 4px 12px var(--btn-op-active-glow);
    }

    .btn-op:hover {
      background: var(--btn-op-hover);
      box-shadow: 0 6px 16px var(--btn-op-active-glow);
    }

    .btn-op.is-active {
      outline: 2px solid #ffffff;
      outline-offset: -2px;
      filter: brightness(1.15);
    }

    /* Equals Key */
    .btn-eq {
      background: var(--btn-eq-bg);
      color: var(--btn-eq-text);
      box-shadow: 0 4px 14px var(--btn-eq-glow);
    }

    .btn-eq:hover {
      background: var(--btn-eq-hover);
      box-shadow: 0 6px 18px var(--btn-eq-glow);
    }

    /* Function Keys */
    .btn-func {
      background: var(--btn-func-bg);
      color: var(--btn-func-text);
    }

    .btn-func:hover {
      background: var(--btn-func-hover);
    }

    /* Danger / Clear Keys */
    .btn-danger {
      background: var(--btn-danger-bg);
      border-color: var(--btn-danger-border);
      color: var(--btn-danger-text);
    }

    .btn-danger:hover {
      background: var(--btn-danger-hover);
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* History Drawer / Modal */
    .history-drawer {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: all 0.25s ease;
    }

    .history-drawer.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .history-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .history-title span {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 6px;
      font-weight: 400;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      scrollbar-width: thin;
    }

    .history-item {
      background: var(--display-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      text-align: right;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .history-item:hover {
      background: var(--btn-num-hover);
      border-color: #3b82f6;
    }

    .history-expr {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .history-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .history-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 8px;
      font-size: 0.88rem;
      text-align: center;
    }

    .history-empty-sub {
      font-size: 0.75rem;
    }

    .history-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
    }

    .drawer-btn {
      flex: 1;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .drawer-btn-danger {
      background: var(--btn-danger-bg);
      border-color: var(--btn-danger-border);
      color: var(--btn-danger-text);
    }

    .drawer-btn-danger:hover {
      background: var(--btn-danger-hover);
    }

    .drawer-btn-close {
      background: var(--btn-func-bg);
      color: var(--text-main);
    }

    .drawer-btn-close:hover {
      background: var(--btn-func-hover);
    }

    /* Footer hints */
    .footer-hint {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--text-dim);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 440px;
      line-height: 1.4;
    }

    .kbd {
      background: var(--display-bg);
      border: 1px solid var(--card-border);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: var(--text-muted);
    }

    @media (max-width: 460px) {
      .calculator-wrapper {
        padding: 18px;
        border-radius: 22px;
      }
      .btn {
        min-height: 58px;
        border-radius: 14px;
      }
      .btn .primary-label {
        font-size: 1.2rem;
      }
      .btn .sub-label {
        font-size: 0.64rem;
      }
      .main-line {
        font-size: 1.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <div class="calculator-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="title-group">
        <h1 class="title-main">
          계산기 / 计算器
          <span class="badge">기본 / 基础</span>
        </h1>
        <div class="title-sub">스마트 이중언어 계산기 / 智能双语计算器</div>
      </div>
      <div class="header-actions">
        <!-- History button -->
        <button class="icon-btn" id="btnToggleHistory" title="계산 기록 / 计算记录">
          <span class="icon">📜</span>
          <span>기록 / 记录</span>
        </button>
        <!-- Theme toggle -->
        <button class="icon-btn" id="btnToggleTheme" title="테마 변경 / 切换主题">
          <span class="icon" id="themeIcon">☀️</span>
          <span id="themeText">라이트 / 亮色</span>
        </button>
      </div>
    </header>

    <!-- Display -->
    <section class="display-container" id="displayBox" title="클릭하여 결과 복사 / 点击复制结果">
      <div class="display-status">
        <span id="statusLabel">대기 중 / 待机</span>
        <span class="copy-hint">클릭 복사 / 点击复制</span>
      </div>
      <div class="expression-line" id="exprDisplay"></div>
      <div class="main-line" id="mainDisplay">0</div>
    </section>

    <!-- Keypad -->
    <main class="keypad">
      <!-- Row 1: AC, DEL, %, ÷ -->
      <button class="btn btn-danger" data-action="clear" id="keyClear">
        <span class="primary-label">AC</span>
        <span class="sub-label">초기화 / 清零</span>
      </button>

      <button class="btn btn-func" data-action="delete" id="keyDelete">
        <span class="primary-label">DEL</span>
        <span class="sub-label">삭제 / 删除</span>
      </button>

      <button class="btn btn-func" data-action="percent" id="keyPercent">
        <span class="primary-label">%</span>
        <span class="sub-label">백분율 / 百分比</span>
      </button>

      <button class="btn btn-op" data-action="operator" data-val="/" id="keyDivide">
        <span class="primary-label">÷</span>
        <span class="sub-label">나눗셈 / 除法</span>
      </button>

      <!-- Row 2: 7, 8, 9, × -->
      <button class="btn btn-num" data-action="num" data-val="7">
        <span class="primary-label">7</span>
        <span class="sub-label">칠 / 七</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="8">
        <span class="primary-label">8</span>
        <span class="sub-label">팔 / 八</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="9">
        <span class="primary-label">9</span>
        <span class="sub-label">구 / 九</span>
      </button>

      <button class="btn btn-op" data-action="operator" data-val="*" id="keyMultiply">
        <span class="primary-label">×</span>
        <span class="sub-label">곱셈 / 乘法</span>
      </button>

      <!-- Row 3: 4, 5, 6, - -->
      <button class="btn btn-num" data-action="num" data-val="4">
        <span class="primary-label">4</span>
        <span class="sub-label">사 / 四</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="5">
        <span class="primary-label">5</span>
        <span class="sub-label">오 / 五</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="6">
        <span class="primary-label">6</span>
        <span class="sub-label">육 / 六</span>
      </button>

      <button class="btn btn-op" data-action="operator" data-val="-" id="keySubtract">
        <span class="primary-label">-</span>
        <span class="sub-label">뺄셈 / 减法</span>
      </button>

      <!-- Row 4: 1, 2, 3, + -->
      <button class="btn btn-num" data-action="num" data-val="1">
        <span class="primary-label">1</span>
        <span class="sub-label">일 / 一</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="2">
        <span class="primary-label">2</span>
        <span class="sub-label">이 / 二</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="3">
        <span class="primary-label">3</span>
        <span class="sub-label">삼 / 三</span>
      </button>

      <button class="btn btn-op" data-action="operator" data-val="+" id="keyAdd">
        <span class="primary-label">+</span>
        <span class="sub-label">덧셈 / 加法</span>
      </button>

      <!-- Row 5: ±, 0, ., = -->
      <button class="btn btn-func" data-action="negate" id="keyNegate">
        <span class="primary-label">±</span>
        <span class="sub-label">부호 / 符号</span>
      </button>

      <button class="btn btn-num" data-action="num" data-val="0">
        <span class="primary-label">0</span>
        <span class="sub-label">영 / 零</span>
      </button>

      <button class="btn btn-num" data-action="dot" id="keyDot">
        <span class="primary-label">.</span>
        <span class="sub-label">소수점 / 小数点</span>
      </button>

      <button class="btn btn-eq" data-action="equals" id="keyEquals">
        <span class="primary-label">=</span>
        <span class="sub-label">계산 / 等于</span>
      </button>
    </main>

    <!-- History Drawer -->
    <div class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <div class="history-title">
          계산 기록 <span>/ 计算记录</span>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">
          <div>기록이 없습니다.</div>
          <div class="history-empty-sub">暂无计算记录</div>
        </div>
      </div>
      <div class="history-footer">
        <button class="drawer-btn drawer-btn-danger" id="btnClearHistory">
          🗑️ 기록 비우기 / 清空
        </button>
        <button class="drawer-btn drawer-btn-close" id="btnCloseHistory">
          닫기 / 关闭
        </button>
      </div>
    </div>
  </div>

  <!-- Keyboard Shortcuts & Bilingual Info Footer -->
  <footer class="footer-hint">
    <div>
      키보드 지원: 숫자키, <span class="kbd">+</span> <span class="kbd">-</span> <span class="kbd">*</span> <span class="kbd">/</span>, <span class="kbd">Enter</span>(=), <span class="kbd">Backspace</span>(삭제), <span class="kbd">Esc</span>(초기화)
    </div>
    <div>
      键盘快捷键：数字键, <span class="kbd">+</span> <span class="kbd">-</span> <span class="kbd">*</span> <span class="kbd">/</span>, <span class="kbd">Enter</span>(等于), <span class="kbd">Backspace</span>(删除), <span class="kbd">Esc</span>(清零)
    </div>
  </footer>

  <script>
    (function () {
      // Elements
      const exprDisplay = document.getElementById('exprDisplay');
      const mainDisplay = document.getElementById('mainDisplay');
      const statusLabel = document.getElementById('statusLabel');
      const displayBox = document.getElementById('displayBox');
      const toast = document.getElementById('toast');
      const historyDrawer = document.getElementById('historyDrawer');
      const historyList = document.getElementById('historyList');
      const btnToggleHistory = document.getElementById('btnToggleHistory');
      const btnCloseHistory = document.getElementById('btnCloseHistory');
      const btnClearHistory = document.getElementById('btnClearHistory');
      const btnToggleTheme = document.getElementById('btnToggleTheme');
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');

      // Calculator State
      let currentInput = '0';
      let previousInput = null;
      let activeOperator = null;
      let shouldResetDisplay = false;
      let isError = false;
      let historyData = [];

      // Operator Display Map
      const opSymbols = {
        '+': '+',
        '-': '-',
        '*': '×',
        '/': '÷'
      };

      // Toast Display
      let toastTimer = null;
      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }

      // Format Numbers with Commas
      function formatNumber(str) {
        if (!str || str === '오류 / 错误') return str;
        const parts = str.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
      }

      // Safe Float Precision
      function cleanFloat(num) {
        if (!Number.isFinite(num)) return NaN;
        return parseFloat(num.toPrecision(12));
      }

      // Update Screen
      function updateScreen() {
        if (isError) {
          mainDisplay.className = 'main-line is-error';
          mainDisplay.innerHTML = `
            <span class="error-tag">오류 / 错误</span>
            <span>${currentInput}</span>
          `;
          statusLabel.textContent = '오류 발생 / 发生错误';
          exprDisplay.textContent = '';
          return;
        }

        mainDisplay.className = 'main-line';
        mainDisplay.textContent = formatNumber(currentInput);

        if (previousInput !== null && activeOperator !== null) {
          exprDisplay.textContent = `${formatNumber(previousInput)} ${opSymbols[activeOperator] || activeOperator}`;
          statusLabel.textContent = '계산 진행 중 / 计算中';
        } else {
          exprDisplay.textContent = '';
          statusLabel.textContent = '대기 중 / 待机';
        }

        // Highlight active operator button
        document.querySelectorAll('.btn-op').forEach(btn => {
          const val = btn.getAttribute('data-val');
          if (activeOperator === val && shouldResetDisplay) {
            btn.classList.add('is-active');
          } else {
            btn.classList.remove('is-active');
          }
        });
      }

      // Trigger Error
      function triggerError(msg) {
        isError = true;
        currentInput = msg;
        updateScreen();
        showToast(`⚠️ ${msg}`);
      }

      // Clear All
      function clearAll() {
        currentInput = '0';
        previousInput = null;
        activeOperator = null;
        shouldResetDisplay = false;
        isError = false;
        updateScreen();
        showToast('초기화 완료 / 已清零');
      }

      // Delete (Backspace)
      function deleteLast() {
        if (isError) {
          clearAll();
          return;
        }
        if (shouldResetDisplay) {
          currentInput = '0';
          shouldResetDisplay = false;
          updateScreen();
          return;
        }
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
          if (currentInput === '-' || currentInput === '-0') currentInput = '0';
        } else {
          currentInput = '0';
        }
        updateScreen();
      }

      // Input Number
      function inputDigit(digit) {
        if (isError) {
          clearAll();
        }
        if (shouldResetDisplay) {
          currentInput = digit;
          shouldResetDisplay = false;
        } else {
          if (currentInput === '0') {
            currentInput = digit;
          } else {
            if (currentInput.replace(/[^0-9]/g, '').length >= 15) {
              showToast('최대 입력 자릿수 초과 / 已达最大位数');
              return;
            }
            currentInput += digit;
          }
        }
        updateScreen();
      }

      // Input Decimal Point
      function inputDot() {
        if (isError) {
          clearAll();
        }
        if (shouldResetDisplay) {
          currentInput = '0.';
          shouldResetDisplay = false;
          updateScreen();
          return;
        }
        if (!currentInput.includes('.')) {
          currentInput += '.';
          updateScreen();
        }
      }

      // Sign Negate (±)
      function toggleSign() {
        if (isError) return;
        if (currentInput === '0') return;
        if (currentInput.startsWith('-')) {
          currentInput = currentInput.substring(1);
        } else {
          currentInput = '-' + currentInput;
        }
        updateScreen();
      }

      // Percentage (%)
      function applyPercent() {
        if (isError) return;
        const val = parseFloat(currentInput);
        if (isNaN(val)) return;
        const res = cleanFloat(val / 100);
        currentInput = String(res);
        shouldResetDisplay = true;
        updateScreen();
      }

      // Core Calculation
      function calculate(n1, op, n2) {
        switch (op) {
          case '+':
            return cleanFloat(n1 + n2);
          case '-':
            return cleanFloat(n1 - n2);
          case '*':
            return cleanFloat(n1 * n2);
          case '/':
            if (n2 === 0) return 'ZERO_DIV';
            return cleanFloat(n1 / n2);
          default:
            return n2;
        }
      }

      // Handle Operator
      function handleOperator(nextOp) {
        if (isError) clearAll();

        const currentVal = parseFloat(currentInput);

        if (activeOperator !== null && !shouldResetDisplay) {
          // Perform chained calculation
          const prevVal = parseFloat(previousInput);
          const result = calculate(prevVal, activeOperator, currentVal);

          if (result === 'ZERO_DIV') {
            triggerError('0으로 나눌 수 없습니다 / 不能除以零');
            return;
          }

          previousInput = String(result);
          currentInput = String(result);
        } else {
          previousInput = currentInput;
        }

        activeOperator = nextOp;
        shouldResetDisplay = true;
        updateScreen();
      }

      // Equals (=)
      function handleEquals() {
        if (isError) return;
        if (activeOperator === null || previousInput === null) return;

        const prevVal = parseFloat(previousInput);
        const currentVal = parseFloat(currentInput);

        const result = calculate(prevVal, activeOperator, currentVal);

        if (result === 'ZERO_DIV') {
          triggerError('0으로 나눌 수 없습니다 / 不能除以零');
          return;
        }

        const exprStr = `${formatNumber(previousInput)} ${opSymbols[activeOperator]} ${formatNumber(currentInput)}`;
        const resultStr = String(result);

        // Add to history
        addHistory(exprStr, resultStr);

        exprDisplay.textContent = `${exprStr} =`;
        currentInput = resultStr;
        previousInput = null;
        activeOperator = null;
        shouldResetDisplay = true;
        statusLabel.textContent = '계산 완료 / 计算完成';

        mainDisplay.className = 'main-line';
        mainDisplay.textContent = formatNumber(resultStr);

        document.querySelectorAll('.btn-op').forEach(btn => btn.classList.remove('is-active'));
      }

      // Add to History
      function addHistory(expr, result) {
        historyData.unshift({ expr, result });
        if (historyData.length > 30) historyData.pop();
        renderHistory();
      }

      // Render History UI
      function renderHistory() {
        if (historyData.length === 0) {
          historyList.innerHTML = `
            <div class="history-empty">
              <div>기록이 없습니다.</div>
              <div class="history-empty-sub">暂无计算记录</div>
            </div>
          `;
          return;
        }

        historyList.innerHTML = historyData.map((item, idx) => `
          <div class="history-item" data-idx="${idx}">
            <div class="history-expr">${item.expr} =</div>
            <div class="history-val">${formatNumber(item.result)}</div>
          </div>
        `).join('');

        // Click on history item restores result
        historyList.querySelectorAll('.history-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = el.getAttribute('data-idx');
            const target = historyData[idx];
            if (target) {
              currentInput = target.result;
              previousInput = null;
              activeOperator = null;
              shouldResetDisplay = true;
              isError = false;
              updateScreen();
              historyDrawer.classList.remove('active');
              showToast(`불러오기 완료 / 已载入: ${formatNumber(target.result)}`);
            }
          });
        });
      }

      // Copy to Clipboard
      displayBox.addEventListener('click', () => {
        if (isError) return;
        const textToCopy = currentInput;
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast(`복사 완료 / 已复制: ${formatNumber(textToCopy)}`);
        }).catch(() => {
          showToast('복사 실패 / 复制失败');
        });
      });

      // Keypad Button Click Routing
      document.querySelector('.keypad').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn');
        if (!btn) return;

        const action = btn.getAttribute('data-action');
        const val = btn.getAttribute('data-val');

        switch (action) {
          case 'num':
            inputDigit(val);
            break;
          case 'dot':
            inputDot();
            break;
          case 'operator':
            handleOperator(val);
            break;
          case 'equals':
            handleEquals();
            break;
          case 'clear':
            clearAll();
            break;
          case 'delete':
            deleteLast();
            break;
          case 'negate':
            toggleSign();
            break;
          case 'percent':
            applyPercent();
            break;
        }
      });

      // Keyboard Support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          e.preventDefault();
          inputDigit(e.key);
        } else if (e.key === '.') {
          e.preventDefault();
          inputDot();
        } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
          e.preventDefault();
          handleOperator(e.key);
        } else if (e.key === 'Enter' || e.key === '=') {
          e.preventDefault();
          handleEquals();
        } else if (e.key === 'Backspace') {
          e.preventDefault();
          deleteLast();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          clearAll();
        } else if (e.key === '%') {
          e.preventDefault();
          applyPercent();
        }
      });

      // History Modal Controls
      btnToggleHistory.addEventListener('click', () => {
        historyDrawer.classList.toggle('active');
      });

      btnCloseHistory.addEventListener('click', () => {
        historyDrawer.classList.remove('active');
      });

      btnClearHistory.addEventListener('click', () => {
        historyData = [];
        renderHistory();
        showToast('기록 삭제 완료 / 记录已清空');
      });

      // Theme Toggle
      let isDark = true;
      btnToggleTheme.addEventListener('click', () => {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          themeIcon.textContent = '☀️';
          themeText.textContent = '라이트 / 亮色';
          showToast('다크 모드 적용 / 暗黑模式');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          themeIcon.textContent = '🌙';
          themeText.textContent = '다크 / 暗色';
          showToast('라이트 모드 적용 / 亮色模式');
        }
      });

      // Initial Render
      updateScreen();
    })();
  </script>
</body>
</html>
